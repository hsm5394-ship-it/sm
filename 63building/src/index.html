<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Building assembly</title>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<style>
@font-face { font-family: "KR"; font-weight: 700; src: url("/node_modules/@fontsource/noto-sans-kr/files/noto-sans-kr-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2190-21FF, U+2000-206F; }
@font-face { font-family: "KR"; font-weight: 900; src: url("/node_modules/@fontsource/noto-sans-kr/files/noto-sans-kr-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2190-21FF, U+2000-206F; }
@font-face { font-family: "KR"; font-weight: 700; src: url("/node_modules/@fontsource/noto-sans-kr/files/noto-sans-kr-korean-700-normal.woff2") format("woff2"); }
@font-face { font-family: "KR"; font-weight: 900; src: url("/node_modules/@fontsource/noto-sans-kr/files/noto-sans-kr-korean-900-normal.woff2") format("woff2"); }

html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; overflow: hidden; }
canvas { position: absolute; left: 0; top: 0; display: block; }
#ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0;
  font-family: "KR", sans-serif; font-weight: 700; color: #fff; pointer-events: none; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 58%, rgba(10,14,24,.30) 100%); }

/* top: timeline */
#top { position: absolute; left: 60px; right: 60px; top: 120px; padding: 26px 34px 30px;
  background: rgba(18,22,32,.66); border-radius: 30px; }
#toprow { display: flex; justify-content: space-between; align-items: baseline; }
#ttl { font-size: 34px; font-weight: 900; letter-spacing: -0.5px; }
#year { font-size: 40px; font-weight: 900; color: #ffd27a; font-variant-numeric: tabular-nums; }
#track { position: relative; height: 12px; margin: 22px 0 0; background: rgba(255,255,255,.22); border-radius: 6px; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: linear-gradient(90deg,#ffb84a,#ffd98a); }
#knob { position: absolute; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgba(255,190,90,.55); }
#ticks { position: relative; height: 62px; margin-top: 12px; }
.tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 23px; line-height: 1.3; text-align: center; white-space: nowrap; color: rgba(255,255,255,.55); }
.tick.on { color: #fff; }
.tick::before { content: ""; position: absolute; left: 50%; top: -22px; width: 3px; height: 12px; margin-left: -1.5px; background: rgba(255,255,255,.75); }

/* counter */
#counter { position: absolute; right: 60px; top: 372px; padding: 14px 30px 18px; text-align: right;
  background: rgba(18,22,32,.66); border-radius: 26px; }
#cnum { font-size: 92px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
#cnum small { font-size: 40px; font-weight: 700; color: rgba(255,255,255,.7); }
#clab { font-size: 28px; color: #ffd27a; margin-bottom: 4px; }

/* bottom caption (kept above the bottom 250px platform UI zone) */
#cap { position: absolute; left: 60px; right: 60px; bottom: 270px; padding: 30px 40px 36px;
  background: rgba(18,22,32,.70); border-radius: 34px; }
#step { display: inline-block; font-size: 28px; font-weight: 900; color: #1b1e27; background: #ffc45c; border-radius: 999px; padding: 4px 22px 6px; }
#ctitle { font-size: 68px; font-weight: 900; letter-spacing: -1.5px; margin-top: 10px; line-height: 1.15; }
#cdesc { font-size: 37px; line-height: 1.38; margin-top: 10px; color: rgba(255,255,255,.93); white-space: pre-line; letter-spacing: -0.5px; }

#hook { position: absolute; left: 60px; right: 60px; bottom: 300px; text-align: center; white-space: pre-line;
  font-size: 96px; font-weight: 900; line-height: 1.2; letter-spacing: -3px;
  text-shadow: 0 4px 0 rgba(18,22,32,.55), 0 0 34px rgba(18,22,32,.75), 0 0 10px rgba(18,22,32,.6); }

#end { position: absolute; left: 50px; right: 50px; bottom: 270px; text-align: center; }
#etitle { font-size: 62px; font-weight: 900; letter-spacing: -1.5px; margin-bottom: 24px;
  text-shadow: 0 3px 0 rgba(18,22,32,.5), 0 0 30px rgba(18,22,32,.8); }
#stats { display: flex; gap: 18px; }
.stat { flex: 1; background: rgba(18,22,32,.72); border-radius: 28px; padding: 26px 6px 28px; }
.stat b { display: block; font-size: 45px; font-weight: 900; color: #ffd27a; letter-spacing: -1.5px; white-space: nowrap; }
.stat span { display: block; font-size: 27px; margin-top: 6px; color: rgba(255,255,255,.9); white-space: nowrap; }

.lbl { position: absolute; left: 0; top: 0; font-size: 30px; font-weight: 900; white-space: nowrap;
  background: rgba(255,255,255,.94); color: #1b1e27; border-radius: 999px; padding: 5px 22px 7px; }
.lbl::after { content: ""; position: absolute; left: 50%; bottom: -34px; width: 4px; height: 34px; margin-left: -2px; background: rgba(255,255,255,.94); }
.lbl::before { content: ""; position: absolute; left: 50%; bottom: -46px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(27,30,39,.5); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="vig"></div>
    <div id="labels"></div>
    <div id="top">
      <div id="toprow"><div id="ttl"></div><div id="year"></div></div>
      <div id="track"><div id="fill"></div><div id="knob"></div></div>
      <div id="ticks"></div>
    </div>
    <div id="counter"><div id="clab"></div><div id="cnum"></div></div>
    <div id="cap"><div id="step"></div><div id="ctitle"></div><div id="cdesc"></div></div>
    <div id="hook"></div>
    <div id="end"><div id="etitle"></div><div id="stats"></div></div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
