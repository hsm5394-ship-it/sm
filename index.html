<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morning Giant</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a0f;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #c{display:block;max-width:100vw;max-height:100vh;width:100vw;height:56.25vw;background:#000}
  @media (min-aspect-ratio:16/9){#c{height:100vh;width:177.78vh}}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 60%,#2a2738 0%,#0b0a0f 70%);color:#efe3c8;
      font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif KR","Noto Serif JP",serif;transition:opacity 1.2s}
  #ov h1{font-weight:400;letter-spacing:.5em;font-size:clamp(20px,3.2vw,40px);margin:0 0 .4em .5em}
  #ov p{opacity:.65;letter-spacing:.25em;font-size:clamp(11px,1.2vw,15px);margin:0 0 2.2em}
  #ov button{font:inherit;color:#1c1820;background:#efe3c8;border:0;border-radius:40px;padding:.8em 2.2em;
      letter-spacing:.3em;font-size:clamp(13px,1.3vw,17px);cursor:pointer}
  #ov button:disabled{opacity:.45;cursor:wait}
  #ov small{margin-top:1.4em;opacity:.45;letter-spacing:.15em;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov">
  <h1>森の巨人</h1>
  <p>잠든 거인이 깨어나는 아침</p>
  <button id="go" disabled>배경을 그리는 중…</button>
  <small>소리를 켜고 감상하세요 · 약 52초</small>
</div>
<script>
'use strict';
/* =====================================================================
   MORNING GIANT — a hand-painted anime short, rendered live in canvas.
   Backgrounds are painted stroke-by-stroke into gouache layers at load;
   the robot is a cel-shaded, hand-inked rig animated on twos.
   ===================================================================== */
const W=1280,H=720,OUT=1.5;
const cv=document.getElementById('c');cv.width=W*OUT;cv.height=H*OUT;
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const Q=new URLSearchParams(location.search);

/* ---------------- utilities ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const ss=(a,b,x)=>sm((x-a)/(b-a));
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function hash1(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash1(i),hash1(i+1),u)}
function fbm(x,o=4){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*noise1(x*f+i*31.7);n+=a;f*=2.03;a*=.5}return s/n}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function mul(a,b){return[a[0]*b[0]/255,a[1]*b[1]/255,a[2]*b[2]/255]}
function rgb(c,a=1){return`rgba(${Math.round(clamp(c[0],0,255))},${Math.round(clamp(c[1],0,255))},${Math.round(clamp(c[2],0,255))},${a})`}
function jit(c,r,amt){return[c[0]+(r()-.5)*amt,c[1]+(r()-.5)*amt*.9,c[2]+(r()-.5)*amt*.8]}

/* Catmull-Rom/Hermite smoothing; a point [x,y,1] is a hard corner */
function smooth(pts,closed=true,seg=8){
  const out=[],n=pts.length,P=i=>pts[(i+n)%n];
  const cnt=closed?n:n-1;
  for(let i=0;i<cnt;i++){
    const p0=closed?P(i-1):pts[Math.max(0,i-1)],p1=P(i),p2=P(i+1),p3=closed?P(i+2):pts[Math.min(n-1,i+2)];
    let t1x=(p2[0]-p0[0])*.5,t1y=(p2[1]-p0[1])*.5,t2x=(p3[0]-p1[0])*.5,t2y=(p3[1]-p1[1])*.5;
    if(p1[2]){t1x=(p2[0]-p1[0])*.25;t1y=(p2[1]-p1[1])*.25}
    if(p2[2]){t2x=(p2[0]-p1[0])*.25;t2y=(p2[1]-p1[1])*.25}
    for(let s=0;s<seg;s++){const t=s/seg,t2=t*t,t3=t2*t;
      const h1=2*t3-3*t2+1,h2=-2*t3+3*t2,h3=t3-2*t2+t,h4=t3-t2;
      out.push([h1*p1[0]+h2*p2[0]+h3*t1x+h4*t2x,h1*p1[1]+h2*p2[1]+h3*t1y+h4*t2y])}
  }
  if(!closed)out.push([pts[n-1][0],pts[n-1][1]]);
  return out;
}
function pathPts(g,P,dx=0,dy=0){g.moveTo(P[0][0]+dx,P[0][1]+dy);for(let i=1;i<P.length;i++)g.lineTo(P[i][0]+dx,P[i][1]+dy);g.closePath()}
function resample(P,closed,step){
  const pts=P.slice();if(closed)pts.push(P[0]);
  const out=[[pts[0][0],pts[0][1]]];let carry=0;
  for(let i=1;i<pts.length;i++){
    const ax=pts[i-1][0],ay=pts[i-1][1],bx=pts[i][0],by=pts[i][1];
    const d=Math.hypot(bx-ax,by-ay);let s=step-carry;
    while(s<=d){out.push([ax+(bx-ax)*s/d,ay+(by-ay)*s/d]);s+=step}
    carry=d-(s-step);
  }
  return out;
}

/* ---------------- ink: pressure-sensitive hand lines ---------------- */
const LDIR=[0.8,-0.6];
const INK={lit:'#2a1c1d',shade:'#1c1726',far:'#1a1621',bg:'#1f1a1e'};
function ink(g,P,closed,w,mode,seed,opt={}){
  const r=mulberry32((seed*9301+49297)|0);
  const step=Math.max(.6,w*.55);
  const S=resample(P,closed,step);const n=S.length;if(n<3)return;
  let area=0;if(closed){for(let i=0;i<n;i++){const a=S[i],b=S[(i+1)%n];area+=a[0]*b[1]-b[0]*a[1]}}
  const sg=area>0?1:-1;
  g.fillStyle=opt.col||INK[mode]||INK.lit;
  // split into strokes like an inker lifting the pen
  const strokes=[];
  if(closed){let i=0;while(i<n-1){const len=Math.floor((26+r()*70)/step);const a=Math.max(0,i-1),b=Math.min(n-1,i+len+1);strokes.push([a,b]);i+=len}}
  else strokes.push([0,n-1]);
  const lit=opt.light!==false&&closed;
  for(const[a,b]of strokes){
    if(b-a<2)continue;
    const L=[],R=[];
    const ph=r()*100;
    for(let i=a;i<=b;i++){
      const p=S[i],pa=S[Math.max(a,i-1)],pb=S[Math.min(b,i+1)];
      let tx=pb[0]-pa[0],ty=pb[1]-pa[1];const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
      const s=(i-a)/(b-a);
      const taper=.18+.82*Math.pow(Math.min(1,s/.16),.7)*Math.pow(Math.min(1,(1-s)/.2),.7);
      let lf=1;
      if(lit){const nx=sg>0?ty:-ty,ny=sg>0?-tx:tx;lf=1-.42*(nx*LDIR[0]+ny*LDIR[1])}
      const nz=.85+.3*noise1(ph+i*step*.05);
      const ww=w*taper*lf*nz*.5*(opt.mul?opt.mul(s):1);
      L.push([p[0]-ty*ww,p[1]+tx*ww]);R.push([p[0]+ty*ww,p[1]-tx*ww]);
    }
    g.beginPath();g.moveTo(L[0][0],L[0][1]);
    for(let i=1;i<L.length;i++)g.lineTo(L[i][0],L[i][1]);
    for(let i=R.length-1;i>=0;i--)g.lineTo(R[i][0],R[i][1]);
    g.closePath();g.fill();
  }
}
function line(g,pts,w,mode,seed,opt){ink(g,smooth(pts,false,6),false,w,mode,seed,opt)}

/* ---------------- gouache brush primitives ---------------- */
function blobPath(g,x,y,rx,ry,ang,r,irr=.3,n=10){
  const ca=Math.cos(ang),sa=Math.sin(ang),P=[];
  for(let i=0;i<n;i++){const a=i/n*TAU,k=1+(r()-.5)*irr;const px=Math.cos(a)*rx*k,py=Math.sin(a)*ry*k;P.push([x+px*ca-py*sa,y+px*sa+py*ca])}
  g.moveTo((P[n-1][0]+P[0][0])/2,(P[n-1][1]+P[0][1])/2);
  for(let i=0;i<n;i++){const p=P[i],q=P[(i+1)%n];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}
  g.closePath();
}
function dab(g,x,y,rx,ry,ang,col,a,r,irr=.3){g.beginPath();blobPath(g,x,y,rx,ry,ang,r,irr);g.fillStyle=rgb(col,a);g.fill()}
function leafPath(g,x,y,len,wid,ang){
  const c=Math.cos(ang),s=Math.sin(ang),nx=-s*wid,ny=c*wid;
  g.moveTo(x,y);
  g.quadraticCurveTo(x+c*len*.45-nx,y+s*len*.45-ny,x+c*len,y+s*len);
  g.quadraticCurveTo(x+c*len*.45+nx,y+s*len*.45+ny,x,y);
}
function leafyPath(g,x,y,rad,r,leaf=.26,flat=1,dens=1){
  blobPath(g,x,y,rad*.8,rad*.8*flat,r()*3,r,.28,9);
  const n=Math.max(7,Math.floor(rad*1.15*dens));
  for(let i=0;i<n;i++){const a=r()*TAU,d=rad*(.56+r()*.32);
    const px=x+Math.cos(a)*d,py=y+Math.sin(a)*d*flat,L=rad*leaf*(.55+r()*.9);
    leafPath(g,px,py,L,L*.4,a+(r()-.5)*1.4)}
}
function leafyCircle(g,x,y,rad,col,r,leaf=.24,dens=1,flat=1){g.beginPath();leafyPath(g,x,y,rad,r,leaf,flat,dens);g.fillStyle=rgb(col);g.fill()}
function clump(g,x,y,rad,pal,r,Ld=[.78,-.62],flat=.86){
  const seed=(r()*1e9)|0;
  const shape=()=>{g.beginPath();leafyPath(g,x,y,rad,mulberry32(seed),.27,flat)};
  shape();g.fillStyle=rgb(pal[0]);g.fill();
  g.save();shape();g.clip();
  g.beginPath();leafyPath(g,x+Ld[0]*rad*.36,y+Ld[1]*rad*.36*flat,rad*.84,r,.3,flat);g.fillStyle=rgb(pal[1]);g.fill();
  g.beginPath();leafyPath(g,x+Ld[0]*rad*.74,y+Ld[1]*rad*.74*flat,rad*.5,r,.34,flat,1.2);g.fillStyle=rgb(pal[2]);g.fill();
  if(pal[3]){g.fillStyle=rgb(pal[3]);g.beginPath();
    const m=Math.max(2,rad*.22|0);
    for(let i=0;i<m;i++){const a=Math.atan2(Ld[1],Ld[0])+(r()-.5)*1.3,d=rad*(.62+r()*.32);
      leafPath(g,x+Math.cos(a)*d,y+Math.sin(a)*d*flat,rad*.12,rad*.05,a+(r()-.5)*1.6)}
    g.fill()}
  g.restore();
}
function makeLayer(x,y,w,h,sc){
  const c=document.createElement('canvas');c.width=Math.ceil(w*sc);c.height=Math.ceil(h*sc);
  const g=c.getContext('2d');g.setTransform(sc,0,0,sc,-x*sc,-y*sc);g.lineJoin='round';g.lineCap='round';
  return{c,g,x,y,w,h,sc};
}
let PAPER=null;
function makePaper(){
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');const r=mulberry32(5);
  const id=g.createImageData(512,512);
  for(let i=0;i<512*512;i++){const v=r();const k=v<.5?0:Math.pow((v-.5)*2,3)*60;id.data[i*4]=40;id.data[i*4+1]=30;id.data[i*4+2]=45;id.data[i*4+3]=k}
  g.putImageData(id,0,0);
  // dry-brush fibres
  for(let i=0;i<1400;i++){g.strokeStyle=`rgba(${r()<.5?'40,30,40':'255,250,235'},${.025+r()*.05})`;g.lineWidth=.6+r()*1.4;
    const x=r()*512,y=r()*512,a=(r()-.5)*.6+(r()<.5?0:Math.PI/2),l=6+r()*30;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  PAPER=c;
}
function paperize(L,a=.7){
  const g=L.g;g.save();g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=a;
  const pat=g.createPattern(PAPER,'repeat');g.fillStyle=pat;g.fillRect(0,0,L.c.width,L.c.height);g.restore();
}

/* ---------------- painted backgrounds ---------------- */
const SKYSTOPS=[[-700,'#22356a'],[-420,'#34508a'],[-160,'#5f78a8'],[40,'#9a9cb8'],[170,'#d7a9a2'],[280,'#f2bb8c'],[360,'#fbd296'],[420,'#ffe6b0'],[560,'#fff2cf']].map(s=>[s[0],hex(s[1])]);
function skyCol(y){for(let i=1;i<SKYSTOPS.length;i++){if(y<=SKYSTOPS[i][0]){const a=SKYSTOPS[i-1],b=SKYSTOPS[i];return mix(a[1],b[1],clamp((y-a[0])/(b[0]-a[0])))}}return SKYSTOPS[SKYSTOPS.length-1][1]}
const SUNX=900;
function sunY(t){return 432-5.2*t}

function paintSky(){
  const L=makeLayer(-260,-760,1800,1340,1.1),g=L.g,r=mulberry32(11);
  const gr=g.createLinearGradient(0,-760,0,580);
  SKYSTOPS.forEach(s=>gr.addColorStop(clamp((s[0]+760)/1340),rgb(s[1])));
  g.fillStyle=gr;g.fillRect(-260,-760,1800,1340);
  for(let i=0;i<3200;i++){const x=-260+r()*1800,y=-760+r()*1340;
    dab(g,x,y,30+r()*110,2.5+r()*6,(r()-.5)*.07,jit(skyCol(y+(r()-.5)*50),r,16),.16+r()*.16,r,.25)}
  // high cirrus streaks catching first light
  for(let k=0;k<9;k++){const cx=-100+r()*1500,cy=-560+r()*420,len=200+r()*360,ang=-.12+(r()-.5)*.15;
    for(let i=0;i<34;i++){const s=r();const x=cx+Math.cos(ang)*len*(s-.5),y=cy+Math.sin(ang)*len*(s-.5)+(r()-.5)*14;
      dab(g,x,y,20+r()*50,1.2+r()*2.6,ang+(r()-.5)*.1,mix(hex('#f6c7b5'),hex('#c7a2c0'),r()),.25+r()*.25,r,.4)}}
  const sun=[SUNX,410];
  function cloud(x,y,w,h,pal,rows=2){
    const puffs=[];const n=Math.floor(w/h*2.4)+4;
    for(let row=0;row<rows;row++){
      for(let i=0;i<n;i++){const t=(i+r()*.6)/n;const hump=Math.sin(t*Math.PI);
        const pr=h*(.22+.42*hump*(.55+r()*.7))*(row?.8:1);
        puffs.push([x+(t-.5)*w,y-hump*h*.38*(row?0.4:1)+row*h*.28+pr*.15,pr])}}
    // the cloud is one painted mass: warm rim toward the sun, cool shadow away from it
    const mx=Math.min(...puffs.map(p=>p[0]-p[2]))-40,my=Math.min(...puffs.map(p=>p[1]-p[2]))-40;
    const Mx2=Math.max(...puffs.map(p=>p[0]+p[2]))+40,My2=Math.max(...puffs.map(p=>p[1]+p[2]))+40;
    const sc=1.1,cw=Math.ceil((Mx2-mx)*sc),ch=Math.ceil((My2-my)*sc);
    const mk=()=>{const c=document.createElement('canvas');c.width=cw;c.height=ch;const q=c.getContext('2d');q.setTransform(sc,0,0,sc,-mx*sc,-my*sc);return[c,q]};
    let ux=sun[0]-x,uy=sun[1]-y;const ul=Math.hypot(ux,uy);ux/=ul;uy/=ul;
    const shape=(q,dx,dy,col,k=1)=>{q.fillStyle=col;q.beginPath();for(const p of puffs){blobPath(q,p[0]+dx,p[1]+dy,p[2]*k,p[2]*.8*k,0,mulberry32((p[0]*13+p[1]*7)|0),.16,12)}q.fill()};
    const [c1,q1]=mk();
    shape(q1,0,0,rgb(pal[3]));q1.globalCompositeOperation='source-atop';
    shape(q1,-ux*h*.07,-uy*h*.07,rgb(pal[2]));
    shape(q1,-ux*h*.2,-uy*h*.2,rgb(pal[1]));
    const [c2,q2]=mk();shape(q2,0,0,rgb(pal[0]));q2.globalCompositeOperation='destination-out';shape(q2,ux*h*.34,uy*h*.34,'#000',1.02);
    q1.drawImage(c2,mx,my,cw/sc,ch/sc);
    const rs=mulberry32((x*3+y)|0);
    for(let i=0;i<40;i++){const p=puffs[(rs()*puffs.length)|0];dab(q1,p[0]+(rs()-.5)*p[2]*1.4,p[1]+(rs()-.5)*p[2]*.8,p[2]*.4,p[2]*.07,(rs()-.5)*.3,rs()<.5?pal[1]:pal[0],.18,rs)}
    g.drawImage(c1,mx,my,cw/sc,ch/sc);
    // flat lit underside wisps
    for(let i=0;i<14;i++)dab(g,x+(r()-.5)*w*.9,y+h*.22+r()*h*.18,w*.08+r()*w*.1,1.5+r()*3,0,pal[3],.35+r()*.35,r,.3);
  }
  const P1=[hex('#8a86ac'),hex('#c4a2ad'),hex('#f8c896'),hex('#fff3d2')];
  const P2=[hex('#6c7aa4'),hex('#a597b4'),hex('#eab494'),hex('#ffe4b6')];
  const P3=[hex('#b2a9c4'),hex('#e0b8b4'),hex('#ffdaa8'),hex('#fff6dc')];
  cloud(120,-330,520,120,P2,2);cloud(1240,-260,460,110,P2,2);
  cloud(300,-60,620,150,P1,2);cloud(1100,40,520,120,P1,2);cloud(720,-180,300,70,P2,1);
  cloud(-40,220,480,90,P3,2);cloud(560,250,380,60,P3,1);cloud(1400,230,520,90,P3,2);
  // horizon glow bands
  for(let i=0;i<120;i++){const y=330+r()*90;dab(g,-200+r()*1700,y,60+r()*200,1.5+r()*3,0,mix(hex('#ffe0a6'),hex('#fff4d8'),r()),.25+r()*.3,r,.2)}
  paperize(L,.5);
  return L;
}

function ridgeFill(g,f,x0,x1,yBot,col,r,strokes,lit){
  g.beginPath();g.moveTo(x0,yBot);for(let x=x0;x<=x1;x+=3)g.lineTo(x,f(x));g.lineTo(x1,yBot);g.closePath();
  g.fillStyle=rgb(col);g.fill();
  g.save();g.clip();
  for(let i=0;i<strokes;i++){const x=x0+r()*(x1-x0);const y=f(x)+r()*(yBot-f(x));
    dab(g,x,y,8+r()*30,2+r()*5,(r()-.5)*.6,jit(col,r,18),.25,r)}
  if(lit){for(let x=x0;x<=x1;x+=2){const d=f(x+3)-f(x-3);if(d>1.2){const k=clamp(d/8);
      const len=6+k*30*(.5+r());dab(g,x,f(x)+len*.45,2+r()*2.5,len*.5,(r()-.5)*.3,mix(col,lit,.6+r()*.4),.5*k+.2,r,.4)}}}
  g.restore();
}
function paintMountains(){
  const L=makeLayer(-260,250,1800,360,1.9),g=L.g,r=mulberry32(21);
  const f1=x=>352-62*fbm(x*.0035+3)-48*Math.pow(fbm(x*.009+9),2);
  ridgeFill(g,f1,-260,1540,610,hex('#a596bf'),r,500,hex('#f2c1aa'));
  const f2=x=>404-48*fbm(x*.0052+20)-20*fbm(x*.02+4);
  ridgeFill(g,f2,-260,1540,610,hex('#8582b2'),r,700,hex('#e7ad9c'));
  // haze at foot of mountains
  const gr=g.createLinearGradient(0,385,0,470);gr.addColorStop(0,'rgba(240,206,190,0)');gr.addColorStop(1,'rgba(246,220,196,1)');
  g.fillStyle=gr;g.fillRect(-260,385,1800,225);
  paperize(L,.55);return L;
}
function paintFarForest(){
  const L=makeLayer(-260,380,1800,240,2.8),g=L.g,r=mulberry32(31);
  const f=x=>448-26*fbm(x*.004+40)-10*fbm(x*.03);
  const pal=[hex('#56707c'),hex('#738c8a'),hex('#b9b293'),hex('#e8d6a8')];
  g.beginPath();g.moveTo(-260,620);for(let x=-260;x<=1540;x+=4)g.lineTo(x,f(x)+8);g.lineTo(1540,620);g.closePath();g.fillStyle=rgb(pal[0]);g.fill();
  for(let row=0;row<4;row++){
    for(let x=-260;x<1540;x+=7+r()*8){const rad=6+r()*8;const y=f(x)+row*12+rad*.4+r()*4;
      clump(g,x,y,rad,pal.map(c=>mix(c,hex('#d8c6b6'),row*.12)),r)}
  }
  const gr=g.createLinearGradient(0,455,0,540);gr.addColorStop(0,'rgba(236,212,192,0)');gr.addColorStop(.6,'rgba(240,216,196,.85)');gr.addColorStop(1,'rgba(244,224,202,1)');

  // look up — a breath
  tone(27.8,3.5,{f:294,gain:.03,att:1.5,rel:1.5,type:'triangle',rev:.7});tone(28.2,3.2,{f:440,gain:.02,att:1.5,rel:1.5,rev:.7});
  // engines
  tone(31.4,1,{f:70,fEnd:260,gain:.06,att:.3,rel:.2,type:'sawtooth',lp:900});
  [31.6,31.85,32.0].forEach(tt=>noise(tt,.12,{type:'bandpass',f:300,gain:.25,rev:.2}));
  tone(IGN,2.2,{f:62,fEnd:26,gain:.7,att:.01,rel:1.8,rev:.3});noise(IGN,3,{type:'lowpass',f:300,fEnd:90,gain:.9,att:.01,rel:2.5,rev:.4});
  noise(IGN+.05,2,{type:'bandpass',f:300,fEnd:1600,q:.8,gain:.3,att:.4,rel:1.2,rev:.4});
  const roar=noise(IGN,13,{type:'bandpass',f:180,q:.6,gain:.4,att:.3,rel:6,rev:.3});
  noise(IGN,13,{type:'highpass',f:2200,gain:.05,att:.4,rel:6,rev:.2});
  // launch
  tone(34.6,2.4,{f:80,fEnd:22,gain:.8,att:.01,rel:2,rev:.4});noise(34.6,4,{type:'bandpass',f:200,fEnd:2400,q:.7,gain:.5,att:.05,rel:3,rev:.5});
  // score: a small nostalgic theme as it climbs into the light
  const pad=[147,220,277,370,330];pad.forEach((f,i)=>tone(35.2+i*.15,16.6,{f,gain:.035,att:3.5,rel:4,type:i%2?'triangle':'sine',lp:1600,rev:.8}));
  const mel=[[37.6,440],[38.2,587],[38.8,659],[39.4,740],[40.6,659],[41.2,587],[41.8,494],[42.4,440],[43.6,587],[44.6,880],[46.6,740],[47.4,659],[48.2,587],[49.4,587]];
  mel.forEach(([tt,f])=>{tone(tt,2.2,{f,gain:.05,att:.01,rel:2,rev:.8});tone(tt,1.4,{f:f*2,gain:.012,att:.01,rel:1.3,rev:.8})});
  return A;
}

/* ---------------- boot ---------------- */
async function build(){
  const step=()=>new Promise(r=>setTimeout(r,0));
  makePaper();makeGrain();await step('paper');
  LAY.sky=paintSky();await step('sky');
  LAY.mtn=paintMountains();await step('mtn');
  LAY.far=paintFarForest();await step('far');
  LAY.back=paintBackForest();await step('back');
  LAY.ground=paintGround();await step('ground');
  LAY.fg=paintForeground();await step('fg');
  LAY.mist1=paintMist(3,2200,200,hex('#fff0dc'));LAY.mist2=paintMist(4,2200,220,hex('#fff4e2'));await step('mist');
  const defs=[
    {x:900,y:626,seed:111,h:290,sp:85,tw:20,lean:.06,p:'back',tp:'back'},
    {x:290,y:634,seed:121,h:400,sp:115,tw:28,lean:-.1,p:'back',tp:'back'},
    {x:1040,y:652,seed:117,h:520,sp:165,tw:40,lean:.04,p:'mid',tp:'mid'},
    {x:1230,y:712,seed:114,h:700,sp:190,tw:58,lean:-.05,p:'front',tp:'front',front:1},
    {x:60,y:740,seed:119,h:780,sp:230,tw:84,lean:.07,p:'front',tp:'front',front:1},
  ];
  for(const d of defs){TREES.push({x:d.x,y:d.y,front:!!d.front,t:paintTree(d.seed,d.h,d.sp,d.tw,d.lean,TREE_PAL[d.p],TRUNK_PAL[d.tp])});await step()}
  await step('trees');bakeParts();
}
let playing=false,t0=0,lastF=-1,audio=null;
function renderAt(t){if(t<SIM.t-1e-6)simReset();while(SIM.t+1/24<=t+1e-6)simStep(1/24);render(t)}
function loop(now){
  if(!playing)return;
  const t=(now-t0)/1000;
  if(t>=DUR){playing=false;renderAt(DUR-.01);const ov=document.getElementById('ov');ov.style.display='flex';ov.style.opacity=1;
    document.getElementById('go').textContent='다시 보기';return}
  const f=Math.floor(t*24);if(f!==lastF){lastF=f;renderAt(f/24)}
  requestAnimationFrame(loop);
}
function play(){
  const ov=document.getElementById('ov');ov.style.opacity=0;setTimeout(()=>ov.style.display='none',1200);
  try{if(audio)audio.close()}catch(e){}
  audio=startAudio();simReset();lastF=-1;playing=true;t0=performance.now();requestAnimationFrame(loop);
}
window.__renderAt=t=>{renderAt(t)};
build().then(()=>{
  simReset();window.__ready=true;
  const go=document.getElementById('go');go.disabled=false;go.textContent='▶ 재생';go.onclick=play;
  if(Q.has('t')){document.getElementById('ov').style.display='none';renderAt(parseFloat(Q.get('t')))}
  else renderAt(3.0);
});
