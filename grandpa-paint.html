<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painted Grandpa</title>
<style>
  html,body{margin:0;height:100%;background:#2a2024;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #c{display:block;height:100vh;width:56.25vh;max-width:100vw;max-height:177.78vw;background:#000;border-radius:2px}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(ellipse at 50% 45%,#5a3f36 0%,#231a1d 75%);color:#fff2df;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;transition:opacity .8s}
  #ov button{font:inherit;font-size:18px;font-weight:600;color:#3a2618;background:#ffd89a;border:0;border-radius:40px;padding:14px 34px;cursor:pointer;box-shadow:0 6px 0 #c9934e}
  #ov button:disabled{opacity:.5;cursor:wait}
  #ov small{opacity:.6;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><button id="go" disabled>준비 중…</button><small>소리를 켜고 감상하세요 · 30초</small></div>
<script>
'use strict';
/* =====================================================================
   PAINTED GRANDPA — a 30-second, 11-shot vertical cartoon.
   Characters are drawn live with soft gradient shading; every pose,
   expression and prop state is a function of time (scrub with ?t=).
   ===================================================================== */
const VW=720,VH=1280;let OUT=1.5;
const cv=document.getElementById('c');cv.width=VW*OUT;cv.height=VH*OUT;
const ctx=cv.getContext('2d');
const TAU=Math.PI*2,Q=new URLSearchParams(location.search);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}; // ease-out-back
function rnd(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// squash-stretch spring: a bouncy settle after an event at t0
const boing=(t,t0,amp=.18,f=14,d=7)=>t<t0?0:amp*Math.exp(-(t-t0)*d)*Math.sin((t-t0)*f);

/* ---------------- soft-shaded primitives ---------------- */
let G=ctx; // current target
function rg(x,y,r,p){const g=G.createRadialGradient(x-r*.38,y-r*.45,r*.05,x,y,r*1.08);g.addColorStop(0,p[0]);g.addColorStop(.5,p[1]);g.addColorStop(1,p[2]);return g}
function ball(x,y,rx,ry,p,rot=0){G.beginPath();G.ellipse(x,y,rx,ry,rot,0,TAU);G.fillStyle=rg(x,y,Math.max(rx,ry),p);G.fill()}
function E(x,y,rx,ry,fill,rot=0){G.beginPath();G.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,TAU);G.fillStyle=fill;G.fill()}
function seg(x1,y1,x2,y2,w,c,a=1){G.globalAlpha=a;G.strokeStyle=c;G.lineWidth=w;G.lineCap='round';G.beginPath();G.moveTo(x1,y1);G.lineTo(x2,y2);G.stroke();G.globalAlpha=1}
function limb(x1,y1,x2,y2,w,p){seg(x1,y1,x2,y2,w,p[2]);seg(x1-w*.05,y1-w*.06,x2-w*.05,y2-w*.06,w*.82,p[1]);seg(x1-w*.2,y1-w*.17,x2-w*.2,y2-w*.17,w*.28,p[0],.55)}
function rrect(x,y,w,h,r){G.beginPath();G.moveTo(x+r,y);G.arcTo(x+w,y,x+w,y+h,r);G.arcTo(x+w,y+h,x,y+h,r);G.arcTo(x,y+h,x,y,r);G.arcTo(x,y,x+w,y,r);G.closePath()}
function lgV(y0,y1,c){const g=G.createLinearGradient(0,y0,0,y1);c.forEach((s,i)=>g.addColorStop(i/(c.length-1),s));return g}
function lgH(x0,x1,c){const g=G.createLinearGradient(x0,0,x1,0);c.forEach((s,i)=>g.addColorStop(i/(c.length-1),s));return g}
function shadow(x,y,rx,ry,a=.22){G.save();G.translate(x,y);G.scale(1,ry/rx);const g=G.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,`rgba(90,50,30,${a})`);g.addColorStop(1,'rgba(90,50,30,0)');G.fillStyle=g;G.beginPath();G.arc(0,0,rx,0,TAU);G.fill();G.restore()}
function ik(sx,sy,tx,ty,a,b,flip){let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1;const m=(a+b)*.995;if(d>m){dx*=m/d;dy*=m/d;d=m}
  const ang=Math.atan2(dy,dx),A=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1)),ea=ang+flip*A;
  return{ex:sx+Math.cos(ea)*a,ey:sy+Math.sin(ea)*a,hx:sx+dx,hy:sy+dy}}
function heartPath(x,y,s){G.beginPath();G.moveTo(x,y+s*.35);G.bezierCurveTo(x-s*1.1,y-s*.3,x-s*.55,y-s*1.05,x,y-s*.45);G.bezierCurveTo(x+s*.55,y-s*1.05,x+s*1.1,y-s*.3,x,y+s*.35);G.closePath()}
function starPath(x,y,r,n=5,k=.45,rot=-Math.PI/2){G.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rr=i%2?r*k:r;G.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}G.closePath()}

/* ---------------- palettes (from the character sheets) ---------------- */
const SKIN=['#ffe7d6','#f7c6aa','#dc9479'],SKIN_K=['#ffeadd','#f9cdb6','#e3a387'];
const HAIR_G=['#fbfbfb','#cfcfd3','#8f9097'],HAIR_B=['#9a6646','#5f3a27','#341d12'];
const CARDI=['#b7c896','#8da06a','#5f7346'],SHIRT=['#fffaf0','#f1e6d2','#cdbda3'],PANTS=['#9c7a62','#76563f','#4d3626'],SLIP=['#b08668','#86624a','#5a3e2c'];
const DRESS=['#eef8e8','#cfe5c6','#9dbd94'],LEG=['#ffffff','#f1eeea','#cfc8c1'],DIAPER=['#ffffff','#f2f2f0','#cfcfd0'];
const CAT=['#ffc27a','#f19a45','#c46a24'],CAT_C=['#fff6e8','#ffe6c8','#e8c39a'];
const MUSTARD=['#ffd884','#e9ac4b','#b77a2a'],SAGE=['#c8d8c0','#98b096','#6b856d'];
const PAINT={red:'#ef3b45',blue:'#2f7cf0',yellow:'#ffd21f',pink:'#ff7fbf',green:'#4cc96a',purple:'#9a5cf0'};

/* ---------------- faces ---------------- */
function eye(x,y,sz,o,iris=['#7a4a2c','#4a2a18','#1c0f08']){
  // o: {kind, blink, look:[lx,ly]}
  const k=o.kind||'open',lx=(o.look?o.look[0]:0)*sz*.25,ly=(o.look?o.look[1]:0)*sz*.2;
  if(k==='closed'){G.strokeStyle='#4a2a1e';G.lineWidth=sz*.22;G.lineCap='round';G.beginPath();G.arc(x,y-sz*.25,sz*.85,Math.PI*.18,Math.PI*.82);G.stroke();return}
  if(k==='happy'){G.strokeStyle='#4a2a1e';G.lineWidth=sz*.24;G.lineCap='round';G.beginPath();G.arc(x,y+sz*.45,sz*.8,Math.PI*1.18,Math.PI*1.82);G.stroke();return}
  const bl=1-(o.blink||0);
  if(bl<.12){G.strokeStyle='#4a2a1e';G.lineWidth=sz*.2;G.beginPath();G.moveTo(x-sz*.8,y);G.quadraticCurveTo(x,y+sz*.25,x+sz*.8,y);G.stroke();return}
  G.save();G.translate(x,y);G.scale(1,bl);
  if(k==='wide'||k==='dots'){E(0,0,sz*1.45,sz*1.6,'#ffffff');G.strokeStyle='rgba(80,40,30,.6)';G.lineWidth=sz*.1;G.stroke();
    if(k==='dots')E(lx*.5,ly*.5,sz*.22,sz*.22,'#1c0f08');else{ball(lx,ly,sz*.62,sz*.68,iris);E(lx-sz*.18,ly-sz*.22,sz*.17,sz*.17,'#fff')}
    G.restore();return}
  E(0,0,sz*1.08,sz*1.18,'#fffdfb');
  ball(lx,ly,sz*.92,sz*1.02,iris);
  E(lx,ly+sz*.05,sz*.42,sz*.46,'#120905');
  E(lx-sz*.32,ly-sz*.38,sz*.3,sz*.3,'#ffffff');E(lx+sz*.32,ly+sz*.34,sz*.12,sz*.12,'rgba(255,255,255,.85)');
  G.restore();
  // upper lid line
  G.strokeStyle='rgba(60,30,20,.75)';G.lineWidth=sz*.14;G.lineCap='round';G.beginPath();G.ellipse(x,y,sz*1.1,sz*1.2*bl,0,Math.PI*1.12,Math.PI*1.88);G.stroke();
}
function mouth(x,y,w,kind,open=1){
  G.lineCap='round';G.lineJoin='round';
  if(kind==='smile'||kind==='grin'){const h=w*(kind==='grin'?.55:.42)*open;
    G.beginPath();G.moveTo(x-w,y);G.quadraticCurveTo(x,y+h*.15,x+w,y);G.quadraticCurveTo(x,y+h*2.2,x-w,y);G.closePath();G.fillStyle='#7a2e2e';G.fill();
    G.save();G.clip();E(x,y+h*1.6,w*.6,h*.7,'#ef7d86');G.fillStyle='#fff';G.fillRect(x-w,y-2,w*2,h*.38);G.restore();return}
  if(kind==='closedSmile'){G.strokeStyle='#8a3a32';G.lineWidth=w*.2;G.beginPath();G.moveTo(x-w,y);G.quadraticCurveTo(x,y+w*.55,x+w,y);G.stroke();return}
  if(kind==='flat'){G.strokeStyle='#8a3a32';G.lineWidth=w*.18;G.beginPath();G.moveTo(x-w*.6,y);G.lineTo(x+w*.6,y);G.stroke();return}
  if(kind==='O'){E(x,y+w*.2*open,w*.55*open+w*.15,w*.75*open+w*.15,'#7a2e2e');E(x,y+w*.55*open,w*.32*open,w*.25*open,'#ef7d86');return}
  if(kind==='o'){E(x,y,w*.28,w*.32,'#7a2e2e');return}
  if(kind==='puff'){G.strokeStyle='#8a3a32';G.lineWidth=w*.16;G.beginPath();G.moveTo(x-w*.35,y);G.quadraticCurveTo(x,y-w*.12,x+w*.35,y);G.stroke();return}
  if(kind==='sneaky'){G.beginPath();G.moveTo(x-w,y-w*.1);G.quadraticCurveTo(x+w*.2,y+w*.25,x+w,y-w*.35);G.quadraticCurveTo(x+w*.1,y+w*.8,x-w,y-w*.1);G.fillStyle='#7a2e2e';G.fill();G.save();G.clip();G.fillStyle='#fff';G.fillRect(x-w,y-w*.4,w*2,w*.32);G.restore();return}
  if(kind==='wavy'){G.strokeStyle='#8a3a32';G.lineWidth=w*.16;G.beginPath();for(let i=0;i<=8;i++){const u=i/8;G.lineTo(x-w*.7+u*w*1.4,y+Math.sin(u*TAU*1.5)*w*.12)}G.stroke();return}
}
function blush(x,y,r,a=.5){const g=G.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,120,120,${a})`);g.addColorStop(1,'rgba(255,120,120,0)');G.fillStyle=g;G.beginPath();G.arc(x,y,r,0,TAU);G.fill()}

/* ---------------- grandpa's face paint (persistent continuity) ---------------- */
function paintState(t){return{
  heart:ss(10.85,12.0,t),hand:t>=12.18?1:0,handPop:t>=12.18?boing(t,12.18,.35,22,9):0,
  stars:clamp((t-13.9)/1.1),must:clamp((t-14.35)/0.95),paws:Math.floor(clamp((t-13.15)/1.25)*5.99)}}
function drawFacePaint(ps,R){
  // heart on his left cheek (viewer right)
  if(ps.heart>0){const s=R*.24;G.save();heartPath(R*.5,R*.28,s);G.clip();G.fillStyle=PAINT.red;G.globalAlpha=.95;
    G.fillRect(R*.5-s*1.2,R*.28+s*.4-s*1.6*ps.heart,s*2.4,s*1.6*ps.heart+1);G.restore();G.globalAlpha=1;
    if(ps.heart>.98){heartPath(R*.5,R*.28,s);G.strokeStyle='rgba(160,20,30,.35)';G.lineWidth=1.2;G.stroke()}}
  // blue handprint on the forehead
  if(ps.hand){const k=1+ps.handPop;G.save();G.translate(-R*.05,-R*.5);G.scale(k,1/k);G.rotate(-.12);G.fillStyle=PAINT.blue;G.globalAlpha=.9;
    E(0,0,R*.2,R*.16,PAINT.blue);
    [[-.2,-.14,-.5],[-.08,-.24,-.18],[.06,-.25,.1],[.19,-.18,.4],[.24,.05,1.2]].forEach(([x,y,a])=>{G.save();G.translate(x*R,y*R);G.rotate(a);E(0,-R*.06,R*.045,R*.08,PAINT.blue);G.restore()});
    G.restore();G.globalAlpha=1}
  // little stars and swirls
  const it=[[-.55,-.15,'star',PAINT.yellow],[.7,-.25,'swirl',PAINT.purple],[-.62,.3,'swirl',PAINT.green],[.3,-.72,'star',PAINT.pink],[-.35,-.68,'star',PAINT.green],[.78,.05,'star',PAINT.yellow]];
  const n=Math.floor(ps.stars*it.length+.001);
  for(let i=0;i<n;i++){const[x,y,k,c]=it[i];
    if(k==='star'){starPath(x*R,y*R,R*.09);G.fillStyle=c;G.fill()}
    else{G.strokeStyle=c;G.lineWidth=R*.035;G.lineCap='round';G.beginPath();for(let a=0;a<10;a+=.3){const rr=R*.012*a;G.lineTo(x*R+Math.cos(a)*rr,y*R+Math.sin(a)*rr)}G.stroke()}}
  // wobbly rainbow mustache (drawn on stroke by stroke)
  if(ps.must>0){const cols=[PAINT.red,'#ff9a2a',PAINT.yellow,PAINT.green,PAINT.blue];
    G.lineCap='round';G.lineWidth=R*.05;
    cols.forEach((c,i)=>{const off=(i-2)*R*.045;G.strokeStyle=c;
      for(const side of[-1,1]){G.beginPath();const L=40;
        for(let k=0;k<=L;k++){const u=k/L;if(u>ps.must)break;const x=side*u*R*.42,y=R*.42+off-Math.sin(u*Math.PI*.9)*R*.12*u+Math.sin(u*19+i)*R*.012+u*u*R*.02*side*0;G.lineTo(x,y-(u>.85?(u-.85)*R*.6:0))}
        G.stroke()}})}
}

/* ---------------- characters ---------------- */
// GRANDPA. origin at feet (stand/walk) or hip (sit). p.view 'front'|'back'
function grandpaHead(p,ps){
  const R=70,lk=(p.look||0)*R*.13,h=p.head||{};
  G.save();G.translate(0,h.dy||0);G.rotate(h.rot||0);G.scale(1+(h.sq||0),1-(h.sq||0));
  if(p.view==='back'){ball(-66,8,17,20,SKIN);ball(66,8,17,20,SKIN);ball(0,0,72,74,SKIN);
    [[-50,-30,30],[50,-30,30],[-30,-55,34],[25,-58,34],[0,-30,48],[-45,10,24],[45,10,24],[0,15,40]].forEach(([x,y,r])=>ball(x,y,r,r*.95,HAIR_G));
    G.strokeStyle='rgba(120,120,128,.45)';G.lineWidth=2;for(let i=0;i<7;i++){G.beginPath();G.arc(-40+i*13,-10,30,Math.PI*.8,Math.PI*1.25);G.stroke()}
    G.restore();return}
  ball(-68+lk*.3,10,17,20,SKIN);ball(68+lk*.3,10,17,20,SKIN);E(-68+lk*.3,10,7,10,'rgba(200,120,100,.5)');E(68+lk*.3,10,7,10,'rgba(200,120,100,.5)');
  ball(0,0,71,73,SKIN);
  // hair: side tufts and the soft wavy top
  [[-66,-22,15],[66,-22,15],[-63,-4,10],[63,-4,10]].forEach(([x,y,r])=>ball(x+lk*.2,y,r,r*1.2,HAIR_G));
  G.beginPath();G.moveTo(-70,-18);G.bezierCurveTo(-78,-70,-40,-96,0,-96);G.bezierCurveTo(44,-96,80,-72,70,-18);
  // wavy hairline with the swoop parted to one side
  G.quadraticCurveTo(62,-40,48,-46);G.quadraticCurveTo(36,-36,24,-48);G.quadraticCurveTo(8,-58,-6,-50);G.quadraticCurveTo(-22,-40,-34,-52);G.quadraticCurveTo(-52,-44,-60,-36);G.quadraticCurveTo(-68,-30,-70,-18);G.closePath();
  G.fillStyle=rg(-10+lk*.2,-70,80,HAIR_G);G.fill();
  ball(-18+lk*.2,-80,26,16,['#ffffff','#dcdce0','#a9aab0'],-.25);ball(26+lk*.2,-78,24,15,['#ffffff','#dcdce0','#a9aab0'],.2);
  G.strokeStyle='rgba(140,140,150,.55)';G.lineWidth=2.2;G.lineCap='round';
  [[-48,-70,-20,-52],[-14,-88,18,-56],[20,-88,50,-50],[44,-80,64,-40]].forEach(([a,b,c,d])=>{G.beginPath();G.moveTo(a+lk*.2,b);G.quadraticCurveTo((a+c)/2+12,(b+d)/2-12,c+lk*.2,d);G.stroke()});
  // wrinkles
  G.strokeStyle='rgba(190,110,90,.35)';G.lineWidth=1.8;for(const y of[-36,-28]){G.beginPath();G.moveTo(-22+lk,y);G.quadraticCurveTo(lk,y-4,22+lk,y);G.stroke()}
  G.save();G.translate(lk,0);
  drawFacePaint(ps,R);
  // brows
  G.strokeStyle='#8e8e95';G.lineWidth=7;G.lineCap='round';const br=h.brow||0;
  G.beginPath();G.moveTo(-40,-14-br);G.quadraticCurveTo(-27,-22-br*1.4,-14,-16-br);G.stroke();
  G.beginPath();G.moveTo(14,-16-br);G.quadraticCurveTo(27,-22-br*1.4,40,-14-br);G.stroke();
  const ek={kind:h.eyes||'open',blink:h.blink||0,look:[p.look||0,h.lookY||0]};
  eye(-26,4,11,ek);eye(26,4,11,ek);
  blush(-42,26,20,.45);blush(42,26,20,.45);
  ball(0,22,15,13,['#ffdcc6','#f2b293','#d38468']);E(-4,17,4,3,'rgba(255,255,255,.7)');
  if(h.bubble>0){const r=h.bubble*16;E(10,36+r*.6,r,r,'rgba(200,230,255,.35)');G.strokeStyle='rgba(255,255,255,.75)';G.lineWidth=1.5;G.beginPath();G.arc(10,36+r*.6,r,0,TAU);G.stroke();E(10-r*.35,36+r*.25,r*.22,r*.22,'rgba(255,255,255,.85)')}
  // mustache paint sits under the nose, over the lip
  mouth(0,48,22,h.mouth||'closedSmile',h.open??1);
  G.restore();
  if(h.sweat>0){const u=h.sweat;G.save();G.translate(78+u*40,-40-u*50+u*u*60);G.rotate(.5);G.beginPath();G.moveTo(0,-14);G.quadraticCurveTo(10,4,0,8);G.quadraticCurveTo(-10,4,0,-14);G.fillStyle='rgba(150,210,255,.95)';G.fill();E(-2,0,2.4,3.4,'#fff');G.restore()}
  G.restore();
}
function cardiganTorso(p,ps,shY,hipY){
  // body: soft sweater barrel
  const w=92,bel=(p.breathe||0)*5;
  G.beginPath();G.moveTo(-w*.82,shY+10);G.quadraticCurveTo(-w*1.05-bel,(shY+hipY)/2,-w*.92,hipY);G.lineTo(w*.92,hipY);G.quadraticCurveTo(w*1.05+bel,(shY+hipY)/2,w*.82,shY+10);
  G.quadraticCurveTo(0,shY-14,-w*.82,shY+10);G.closePath();G.fillStyle=rg(-10,(shY+hipY)/2,w*1.15,CARDI);G.fill();
  if(p.view==='back'){G.fillStyle='rgba(70,90,50,.35)';G.fillRect(-w*.92,hipY-14,w*1.84,14);return}
  // shirt V with plaid
  G.save();G.beginPath();G.moveTo(-30,shY-2);G.lineTo(0,shY+70);G.lineTo(30,shY-2);G.closePath();G.fillStyle=lgV(shY,shY+70,SHIRT);G.fill();G.clip();
  G.strokeStyle='rgba(230,170,120,.45)';G.lineWidth=1.2;for(let i=-30;i<=30;i+=9){G.beginPath();G.moveTo(i,shY-4);G.lineTo(i,shY+72);G.stroke();G.beginPath();G.moveTo(-32,shY+i+30);G.lineTo(32,shY+i+30);G.stroke()}
  G.restore();
  // collar points
  G.fillStyle=SHIRT[1];G.beginPath();G.moveTo(-30,shY-4);G.lineTo(-8,shY+20);G.lineTo(-2,shY);G.closePath();G.fill();G.beginPath();G.moveTo(30,shY-4);G.lineTo(8,shY+20);G.lineTo(2,shY);G.closePath();G.fill();
  // placket, buttons, pockets, ribbing
  G.strokeStyle='rgba(80,100,55,.55)';G.lineWidth=3;G.beginPath();G.moveTo(-30,shY-2);G.lineTo(0,shY+70);G.lineTo(0,hipY);G.moveTo(30,shY-2);G.lineTo(0,shY+70);G.stroke();
  for(let i=0;i<3;i++)ball(-1,shY+86+i*(hipY-shY-100)/3,5,5,['#a67256','#6e4330','#432517']);
  G.strokeStyle='rgba(80,100,55,.45)';G.lineWidth=2.5;rrect(-70,hipY-58,38,32,6);G.stroke();rrect(32,hipY-58,38,32,6);G.stroke();
  G.fillStyle='rgba(70,90,50,.3)';G.fillRect(-w*.92,hipY-13,w*1.84,13);

  const bounce=k=>u<1.25?Math.abs(Math.sin(u*9+k))*-40:0;
  drawSister({x:lerp(1110,1205,leap),y:lerp(1130,1030,leap)+bounce(0)+(leap>0&&leap<1?-Math.sin(leap*Math.PI)*70:0),s:1,look:1,head:{eyes:'happy',mouth:'grin'},
    armL:hug?[40,-150]:[-60,-200],armR:hug?[70,-160]:[60,-200]});
  drawBaby({x:lerp(1500,1395,leap),y:lerp(1140,1035,leap)+bounce(2)+(leap>0&&leap<1?-Math.sin(leap*Math.PI)*70:0),s:1,look:-1,noseStar:1,head:{eyes:'happy',mouth:'grin'},
    armL:hug?[-60,-130]:[-50,-160],armR:hug?[-10,-120]:[50,-160],blueL:true});
  const kx=lerp(1420,1365,leap),ky=lerp(1140,862,leap)+(u<1.25?Math.abs(Math.sin(u*9+1))*-30:0)-(leap>0&&leap<1?Math.sin(leap*Math.PI)*90:0);
  drawKitten({x:kx,y:ky,s:.85,face:-1,look:-.5,yellowPaw:true,head:{eyes:'happy',mouth:'open'},tailWag:Math.sin(u*7)});
  if(hug)grandpaArms(Object.assign({},gp,{armL:[-88,-176],armR:[92,-150]}),ps);else grandpaArms(gp,ps);
  // sparkles and hearts drift up
  if(u>1.6){const r=rnd(11);for(let i=0;i<22;i++){const st=1.6+r()*1.2,a=u-st;if(a<0)continue;const x=1300+(r()-.5)*420+Math.sin(a*2+i)*16,y=900-a*120-r()*80;const al=clamp(1-a/1.6);
    G.globalAlpha=al;if(i%3===0){heartPath(x,y,9+r()*6);G.fillStyle=PAINT.pink;G.fill()}else sparkleAt(x,y,8+r()*8,i%2?'#fff6c8':'#ffe08a',a*2);G.globalAlpha=1}}
}

/* ---------------- sound: synthesized foley, giggles and ukulele ---------------- */
function startAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;const A=new AC();const T=A.currentTime+.08;
  const out=A.createDynamicsCompressor();out.connect(A.destination);const master=A.createGain();master.gain.value=.9;master.connect(out);
  const nb=A.createBuffer(1,A.sampleRate*2,A.sampleRate);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const env=(g,t,a,p,d)=>{g.gain.setValueAtTime(0,T+t);g.gain.linearRampToValueAtTime(p,T+t+a);g.gain.exponentialRampToValueAtTime(.0001,T+t+a+d)};
  function noise(t,d,{type='bandpass',f=1000,f2,q=1,gain=.2,a=.005}={}){const s=A.createBufferSource();s.buffer=nb;const fl=A.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,T+t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,T+t+d);fl.Q.value=q;const g=A.createGain();env(g,t,a,gain,d);s.connect(fl);fl.connect(g);g.connect(master);s.start(T+t,Math.random());s.stop(T+t+a+d+.05)}
  function tone(t,d,{type='sine',f=440,f2,gain=.2,a=.005,vib=0,lp}={}){const o=A.createOscillator();o.type=type;o.frequency.setValueAtTime(f,T+t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+t+d);
    if(vib){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=vib;lg.gain.value=f*.04;l.connect(lg);lg.connect(o.frequency);l.start(T+t);l.stop(T+t+a+d+.05)}
    const g=A.createGain();env(g,t,a,gain,d);let n=o;if(lp){const fl=A.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}n.connect(g);g.connect(master);o.start(T+t);o.stop(T+t+a+d+.05)}
  // Karplus-Strong ukulele pluck
  function pluck(t,f,gain=.25){const sr=A.sampleRate,len=Math.floor(sr*1.4),b=A.createBuffer(1,len,sr),d=b.getChannelData(0),N=Math.floor(sr/f);const buf=new Float32Array(N);for(let i=0;i<N;i++)buf[i]=Math.random()*2-1;
    for(let i=0;i<len;i++){const j=i%N;const v=buf[j];d[i]=v;buf[j]=.5*(v+buf[(j+1)%N])*.996}
    const s=A.createBufferSource();s.buffer=b;const g=A.createGain();g.gain.value=gain;s.connect(g);g.connect(master);s.start(T+t)}
  const uke=(t,notes,gap=.07,g=.22)=>notes.forEach((f,i)=>pluck(t+i*gap,f,g));
  function giggle(t,base,n=6,g=.08){for(let i=0;i<n;i++){const f=base*(1+(i%2)*.18+Math.random()*.05);tone(t+i*.11,.08,{type:'triangle',f,f2:f*.82,gain:g,a:.01,vib:28})}}
  function snore(t){noise(t,1.0,{type:'bandpass',f:220,q:3,gain:.25,a:.6});tone(t,.9,{type:'sawtooth',f:62,f2:70,gain:.06,a:.5,lp:300});tone(t+1.1,.5,{f:900,f2:700,gain:.015,a:.1})}
  // clock and snoring through the sleeping shots
  for(let s=0;s<15.5;s+=1)noise(s,.03,{type:'highpass',f:3000,gain:.06});
  for(let s=.2;s<15.4;s+=2.2)snore(s);
  // shot 2
  noise(3.45,.06,{type:'bandpass',f:500,gain:.35});noise(3.55,.12,{type:'lowpass',f:900,gain:.18});tone(3.85,.08,{f:880,f2:1320,gain:.05});
  noise(4.1,.5,{type:'highpass',f:3500,gain:.07,a:.05});
  // shot 3 tiptoes + sneaky tone
  for(let i=0;i<8;i++)tone(5.15+i*.28,.07,{f:1200+(i%2)*200,f2:1500+(i%2)*200,gain:.06});
  [5.1,5.6,6.1,6.6].forEach((s,i)=>tone(s,.18,{type:'triangle',f:[392,349,330,294][i],gain:.05,lp:1200}));
  // shot 4
  noise(8.1,.08,{type:'bandpass',f:900,q:2,gain:.3});noise(8.85,.12,{type:'lowpass',f:700,gain:.5});tone(8.85,.1,{f:240,f2:90,gain:.2});
  giggle(8.95,620,7);tone(9.75,.4,{type:'triangle',f:620,f2:780,gain:.04,vib:6});uke(9.9,[523,659,784,1047]);
  // shot 5
  for(let i=0;i<5;i++)noise(10.9+i*.22,.15,{type:'bandpass',f:2400,q:1,gain:.08});
  noise(12.18,.14,{type:'lowpass',f:800,gain:.6});tone(12.18,.12,{f:200,f2:80,gain:.25});giggle(12.3,700,4);
  // shot 6
  for(let i=0;i<5;i++)tone(13.2+i*.25,.06,{f:320,f2:260,gain:.1});
  for(let i=0;i<6;i++)noise(14+i*.2,.13,{type:'bandpass',f:2800,q:1,gain:.07});
  giggle(14.6,560,5,.05);giggle(15.1,720,4,.05);
  // shot 7: yawn, newspaper, then silence
  tone(16.85,.9,{type:'sawtooth',f:230,f2:150,gain:.14,a:.15,lp:900});tone(16.85,.9,{type:'sawtooth',f:233,f2:152,gain:.08,a:.15,lp:1400});
  noise(17.1,.7,{type:'highpass',f:2500,gain:.12,a:.08});
  // shot 8 slippers
  for(let i=0;i<8;i++)noise(18.4+i*.3,.12,{type:'lowpass',f:600,gain:.25});
  // shot 9: record scratch + shock hit
  tone(21.5,.35,{type:'sawtooth',f:900,f2:150,gain:.12,vib:40});noise(21.5,.3,{type:'bandpass',f:1500,f2:400,q:2,gain:.25});
  tone(21.65,.6,{f:65,f2:50,gain:.6});tone(21.65,.25,{type:'square',f:196,gain:.07,lp:900});tone(21.85,.5,{type:'square',f:185,gain:.07,lp:900});
  // shot 10: heartbeat, mood flip, brush tok, giggle
  for(const s of[24.0,24.65,25.3]){tone(s,.18,{f:55,f2:40,gain:.5});tone(s+.17,.15,{f:50,f2:38,gain:.35})}
  uke(25.35,[392,494,587,784],.06,.25);tone(25.4,.6,{type:'triangle',f:1568,f2:2093,gain:.04});
  noise(26.3,.05,{type:'bandpass',f:1800,q:3,gain:.35});giggle(26.4,760,6,.07);
  // shot 11: cheers, sparkle, ting
  giggle(27.1,600,8,.06);giggle(27.2,780,8,.06);tone(27.3,.3,{type:'triangle',f:700,f2:950,gain:.05,vib:8});
  uke(27.05,[262,330,392,523],.03,.2);uke(27.9,[294,370,440,587],.03,.2);uke(28.7,[262,330,392,523],.03,.22);
  for(let i=0;i<10;i++)tone(28.7+i*.05,.25,{f:1600+i*180,gain:.03});
  tone(29.3,1.2,{f:1760,gain:.12});tone(29.3,1.0,{f:3520,gain:.04});
  return A;
}

/* ---------------- boot / playback ---------------- */
const DUR=30;let playing=false,t0=0,lastF=-1,audio=null,PERF=[];const SCALES=[1.5,1,.75];
function setScale(s){OUT=s;cv.width=Math.round(VW*s);cv.height=Math.round(VH*s)}
function loop(now){if(!playing)return;const t=(now-t0)/1000;
  if(t>=DUR){playing=false;render(DUR-.01);const ov=document.getElementById('ov');ov.style.display='flex';ov.style.opacity=1;document.getElementById('go').textContent='다시 보기';return}
  const f=Math.floor(t*30);if(f!==lastF){lastF=f;const s=performance.now();render(f/30);PERF.push(performance.now()-s);
    if(PERF.length>=20){const a=PERF.reduce((x,y)=>x+y)/PERF.length;PERF=[];const i=SCALES.indexOf(OUT);if(a>30&&i<SCALES.length-1)setScale(SCALES[i+1])}}
  requestAnimationFrame(loop)}
function play(){const ov=document.getElementById('ov');ov.style.opacity=0;setTimeout(()=>ov.style.display='none',800);
  try{if(audio)audio.close()}catch(e){}audio=startAudio();PERF=[];lastF=-1;playing=true;t0=performance.now();requestAnimationFrame(loop)}
window.__renderAt=t=>render(t);
setTimeout(()=>{paintRoom();window.__ready=true;const go=document.getElementById('go');go.disabled=false;go.textContent='▶ 재생';go.onclick=play;
  if(Q.has('t')){document.getElementById('ov').style.display='none';render(parseFloat(Q.get('t')))}else render(1.2)},30);
</script>
